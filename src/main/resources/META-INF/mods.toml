modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Блоки цветного света регистрируются на обеих сторонах.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# FL Render: сам цветной свет (у игроков). На сервере не нужен.
[[dependencies.${mod_id}]]
    modId="flrender"
    mandatory=true
    versionRange="[0.2.0,)"
    ordering="AFTER"
    side="CLIENT"
